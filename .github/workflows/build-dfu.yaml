name: Build DFU packages

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-dfu.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-dfu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [ultra, lite]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies and set up mergehex shim
        run: |
          pip install intelhex --quiet

          cat <<'EOF' | sudo tee /usr/local/bin/mergehex > /dev/null
          #!/usr/bin/env python3
          import sys
          from intelhex import IntelHex

          def main(argv):
              inputs, out = [], None
              i = 0
              while i < len(argv):
                  a = argv[i]
                  if a in ('-m', '--merge'):
                      i += 1
                      while i < len(argv) and not argv[i].startswith('-'):
                          inputs.append(argv[i])
                          i += 1
                      continue
                  if a in ('-o', '--output'):
                      out = argv[i + 1]
                      i += 2
                      continue
                  if a in ('-h', '--help'):
                      print("mergehex shim: --merge f1 f2 ... --output out.hex")
                      return 0
                  i += 1

              if not inputs or not out:
                  print("mergehex shim: need --merge <files> and --output <file>", file=sys.stderr)
                  return 2

              merged = IntelHex()
              for f in inputs:
                  part = IntelHex(f)
                  overlap = set(merged.addresses()) & set(part.addresses())
                  if overlap:
                      lo = min(overlap)
                      print(f"mergehex shim: overlap at 0x{lo:X} merging {f}", file=sys.stderr)
                      return 1
                  merged.merge(part, overlap='replace')

              merged.write_hex_file(out)
              return 0

          if __name__ == '__main__':
              sys.exit(main(sys.argv[1:]))
          EOF

          sudo chmod +x /usr/local/bin/mergehex

      - name: Install pinned ARM GNU toolchain 15.2.Rel1 + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip xz-utils
          VER=15.2.rel1
          TC=arm-gnu-toolchain-${VER}-x86_64-arm-none-eabi
          URL=https://developer.arm.com/-/media/Files/downloads/gnu/${VER}/binrel/${TC}.tar.xz
          curl -fSL "$URL" -o /tmp/armgcc.tar.xz
          sudo mkdir -p /opt/armgcc
          sudo tar -xJf /tmp/armgcc.tar.xz -C /opt/armgcc
          echo "/opt/armgcc/${TC}/bin" >> "$GITHUB_PATH"
          echo "GNU_INSTALL_ROOT=/opt/armgcc/${TC}/bin/" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          arm-none-eabi-gcc --version
          test "$(arm-none-eabi-gcc -dumpversion | cut -d. -f1)" = "15" \
            || { echo "::error::expected GCC 15, got $(arm-none-eabi-gcc -dumpversion)"; exit 1; }

      - name: Install nrfutil + nrf5sdk-tools
        run: |
          curl -fsSL https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil \
            -o /usr/local/bin/nrfutil
          chmod +x /usr/local/bin/nrfutil
          nrfutil install nrf5sdk-tools
          nrfutil --version

      - name: Build ${{ matrix.device }} firmware
        working-directory: firmware
        env:
          CURRENT_DEVICE_TYPE: ${{ matrix.device }}
        run: |
          chmod +x build.sh
          ./build.sh
          echo "---- built artifacts ----"
          ls -la objects/${{ matrix.device }}-dfu-app.zip \
                 objects/${{ matrix.device }}-dfu-full.zip \
                 objects/${{ matrix.device }}-application.uf2 || true

      - name: Collect artifacts
        working-directory: firmware
        run: |
          mkdir -p ../dist
          cp objects/${{ matrix.device }}-dfu-app.zip     ../dist/ 2>/dev/null || true
          cp objects/${{ matrix.device }}-dfu-full.zip    ../dist/ 2>/dev/null || true
          cp objects/${{ matrix.device }}-application.uf2 ../dist/ 2>/dev/null || true
          cp objects/${{ matrix.device }}-fullimage.uf2   ../dist/ 2>/dev/null || true
          ls -la ../dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-dfu
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    # Runs on tag pushes OR pushes to main branch
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all matrix build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate files for release
        run: |
          mkdir release-dist
          find all-artifacts -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Create Release and attach files
        uses: softprops/action-gh-release@v2
        with:
          # Uses the tag name if present, otherwise creates a "nightly" tag for main branch pushes
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release-dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
